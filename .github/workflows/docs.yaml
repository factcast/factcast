name: 'Publish Documentation'
on:
  release:
    types:
    - 'published'
  push:
    branches:
    - 'main'
    paths:
    - 'factcast-docs/src/main/asciidoc/modules/blog/pages/**'
  workflow_dispatch: {}
permissions:
  contents: 'read'
  pages: 'write'
  id-token: 'write'
  actions: 'read'
concurrency:
  group: 'documentation-pages'
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: 'ubuntu-latest'
    if: '${{ github.event_name == ''push'' || github.event_name == ''workflow_dispatch'' || !github.event.release.prerelease }}'
    environment:
      name: 'github-pages'
    steps:
    - id: 'step-0'
      name: 'Checkout documentation builder and release tags'
      uses: 'actions/checkout@v7'
      with:
        ref: '${{ github.event.repository.default_branch }}'
        fetch-depth: '0'
    - id: 'step-1'
      name: 'Set up Java'
      uses: 'actions/setup-java@v6'
      with:
        java-version: '25'
        distribution: 'temurin'
    - id: 'step-2'
      name: 'Generate Docs'
      run: './mvnw --full -B -pl factcast-docs -Dantora.playbook=antora-playbook-release.yml clean package'
    - id: 'step-3'
      name: 'Configure Pages'
      uses: 'actions/configure-pages@v6'
    - id: 'step-4'
      name: 'Upload Maven site'
      uses: 'actions/upload-pages-artifact@v5'
      with:
        path: 'factcast-docs/target/site'
    - id: 'step-5'
      name: 'Deploy Pages'
      uses: 'actions/deploy-pages@v5'
