<!doctype html><html xmlns:wicket="http://wicket.apache.org" lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login · FactCast Server UI</title></head>
<body class="login-body"><main class="login-card"><h1>FactCast Server UI</h1><p>Sign in to explore your facts.</p><p wicket:id="message" role="alert"></p><form wicket:id="login" method="post"><input type="hidden" wicket:id="csrf"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="primary" type="submit">Log in</button></form></main></body></html>
